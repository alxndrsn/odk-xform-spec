name: Build Site

on:
  push:
    branches: [ 'gh-pages' ]
  pull_request:
    branches: [ 'gh-pages' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - run: bundle exec jekyll build
